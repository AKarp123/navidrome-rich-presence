[package]
name = "navidrome-rpc"
version = "1.2.0"
edition = "2021"
description = "Subsonic now playing status for Discord Rich Presence"

[dependencies]
discord-rich-presence = "1.1"
opensubsonic = "0.6.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
strip = true
lto = true
